# CI gate (spec 16): every PR must build + lint + type-check + test across the workspace before
# it can merge. Uses the PINNED Node + pnpm (spec 00) and a frozen lockfile. NO production secrets
# are exposed to the job; any DB-facing live test is env-gated and SKIPS here (no DATABASE_URL /
# MYSQL_URL / ANTHROPIC_API_KEY set), which is the intended CI behavior.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm (pinned)
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Use pinned Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Turborepo runs each task across apps/web, apps/api, packages/shared.
      - name: Build
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm type-check
      - name: Test
        run: pnpm test
